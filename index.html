    const INITIAL_BALANCES = { inversiones: 0, general: 0, nomina: 0, emergencia: 0, prestamo: 0, insumos: 0 };

    // ─── FORMATOS MÓVILES ───
    const fmt = (n) => `RD$ ${Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const pct = (a, b) => (b > 0 ? ((a / b) * 100).toFixed(1) + "%" : "0%");
    const hoy = () => new Date().toISOString().slice(0, 10);
    const obtenerMesActual = () => new Date().toISOString().slice(0, 7);

    function useStore(key, init) {
      const [v, set] = useState(() => {
        try {
          const s = localStorage.getItem(key);
          return s ? JSON.parse(s) : init;
        } catch { return init; }
      });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(v)); } catch {}
      }, [key, v]);
      return [v, set];
    }

    // ─── COMPONENTE CONTROLADOR DE ICONOS/EMOJIS PERSONALIZADOS ──────────────────
    function IconoCustom({ source, size = 18 }) {
      if (!source) return null;
      if (source.startsWith("http")) {
        return <img src={source} style={{ width: size, height: size, objectFit: "contain" }} alt="icon" />;
      }
      if (source.trim().startsWith("<svg")) {
        return <div style={{ width: size, height: size, display: "flex", alignItems: "center", justifyContent: "center" }} dangerouslySetInnerHTML={{ __html: source }} />;
      }
      return <span style={{ fontSize: size }}>{source}</span>;
    }

    // ─── COMPONENTES ESTILOS COMPACTOS CON BOX-SIZING PROTEGIDO ─────────────────
    function Card({ children, style = {}, glow = false }) {
      return (
        <div style={{ background: B.fondoCard, border: `1px solid ${glow ? B.azulOscuro + "99" : B.fondoBorde}`, borderRadius: 20, padding: 18, width: "100%", boxSizing: "border-box", ...style }}>
          {children}
        </div>
      );
    }
    function Lbl({ children, style = {} }) {
      return <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.14em", color: B.textoSub, marginBottom: 8, fontFamily: "-apple-system, sans-serif", ...style }}>{children}</div>;
    }
    function Inp({ style = {}, ...p }) {
      return <input {...p} style={{ background: "#091526", border: `1px solid ${B.fondoBorde}`, borderRadius: 12, padding: "11px 14px", color: B.texto, fontSize: 15, width: "100%", boxSizing: "border-box", outline: "none", ...style }} />;
    }
    function Sel({ children, style = {}, ...p }) {
      return <select {...p} style={{ background: "#091526", border: `1px solid ${B.fondoBorde}`, borderRadius: 12, padding: "11px 14px", color: B.texto, fontSize: 14, width: "100%", boxSizing: "border-box", outline: "none", ...style }}>{children}</select>;
    }
    function Btn({ children, onClick, v = "primary", style = {}, disabled = false }) {
      const vs = {
        primary: { background: `linear-gradient(135deg,${B.azulOscuro},${B.azulMedio})`, color: "#fff", border: "none" },
        ghost: { background: "transparent", color: B.celeste, border: `1px solid ${B.celeste}44` },
        danger: { background: `linear-gradient(135deg, #DC2626, #EF4444)`, color: "#fff", border: "none" },
      };
      return (
        <button onClick={onClick} disabled={disabled} style={{ ...vs[v], borderRadius: 14, padding: "13px 20px", fontSize: 15, fontWeight: 600, cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.45 : 1, width: "100%", boxSizing: "border-box", ...style }}>
          {children}
        </button>
      );
    }

    // ─── PESTAÑA INICIO: CON MATEMÁTICA EN TIEMPO REAL REVERSIBLE ─────────────────
    function Dashboard({ registros = [], pagos = [], todasCats = [], balancesIniciales = INITIAL_BALANCES, mesFiltro }) {
      const registrosDelMes = registros.filter((r) => r.fecha.startsWith(mesFiltro));
      const ingresosMes = registrosDelMes.reduce((s, r) => s + (parseFloat(r.ingreso) || 0), 0);

      // Filtrar pagos que corresponden exclusivamente al mes seleccionado
      const pagosDelMes = pagos.filter((p) => p.mes === mesFiltro);
      const pagosPendientes = pagosDelMes
        .filter((p) => !p.ok)
        .reduce((s, p) => s + (parseFloat(p.monto) || 0), 0);

      const saldosCuentas = {};
      CUENTAS.forEach((c) => {
        saldosCuentas[c.id] = parseFloat(balancesIniciales[c.id]) || 0;
      });

      registros.forEach((r) => {
        if (r.fecha.slice(0, 7) <= mesFiltro) {
          (r.items || []).forEach((i) => {
            let cId = "general";
            const catObj = todasCats.find((c) => c.nombre === i.cat);
            if (catObj) cId = catObj.cuenta;
            if (saldosCuentas[cId] !== undefined) saldosCuentas[cId] += parseFloat(i.monto) || 0;
          });
        }
      });

      pagos.forEach((p) => {
        if (p.ok && p.mes <= mesFiltro) {
          const cuentaDestino = p.cuenta || "general";
          if (saldosCuentas[cuentaDestino] !== undefined) {
            saldosCuentas[cuentaDestino] -= parseFloat(p.monto) || 0;
          }
        }
      });

      const saldoTotalGlobal = Object.values(saldosCuentas).reduce((a, b) => a + b, 0);
      const gananciaAcumulada = saldosCuentas["inversiones"] || 0;

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 16, width: "100%", boxSizing: "border-box" }}>
          <div>
            <div style={{ fontSize: 10, color: B.textoSub, textTransform: "uppercase", letterSpacing: 1 }}>RESUMEN CONTROL</div>
            <div style={{ fontSize: 20, fontWeight: 700, color: B.texto, marginTop: 2 }}>Periodo Contable</div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, width: "100%" }}>
            <div style={{ background: B.fondoCard, border: `1px solid ${B.fondoBorde}`, borderRadius: 16, padding: 14, display: "flex", flexDirection: "column", gap: 4 }}>
              <span style={{ fontSize: 10, color: B.textoSub, fontWeight: 700 }}>SALDO TOTAL CUENTAS</span>
              <span style={{ fontSize: 15, fontWeight: 700, color: B.texto }}>{fmt(saldoTotalGlobal)}</span>
            </div>
            <div style={{ background: B.fondoCard, border: `1px solid ${B.fondoBorde}`, borderRadius: 16, padding: 14, display: "flex", flexDirection: "column", gap: 4 }}>
              <span style={{ fontSize: 10, color: B.textoSub, fontWeight: 700 }}>GANANCIA ACUMULADA</span>
              <span style={{ fontSize: 15, fontWeight: 700, color: "#22C55E" }}>{fmt(gananciaAcumulada)}</span>
            </div>
            <div style={{ background: B.fondoCard, border: `1px solid ${B.fondoBorde}`, borderRadius: 16, padding: 14, display: "flex", flexDirection: "column", gap: 4 }}>
              <span style={{ fontSize: 10, color: B.textoSub, fontWeight: 700 }}>INGRESO DEL MES</span>
              <span style={{ fontSize: 15, fontWeight: 700, color: B.celeste }}>{fmt(ingresosMes)}</span>
            </div>
            <div style={{ background: B.fondoCard, border: `1px solid ${B.azulOscuro}55`, borderRadius: 16, padding: 14, display: "flex", flexDirection: "column", gap: 4 }}>
              <span style={{ fontSize: 10, color: B.textoSub, fontWeight: 700 }}>PAGOS PENDIENTES</span>
              <span style={{ fontSize: 15, fontWeight: 700, color: "#FB923C" }}>{fmt(pagosPendientes)}</span>
            </div>
          </div>

          <Card style={{ padding: 14 }}>
            <Lbl>DISTRIBUCIÓN DEL MES</Lbl>
            <div style={{ height: 12, borderRadius: 6, display: "flex", overflow: "hidden", background: B.fondoBorde, marginBottom: 12 }}>
              {CUENTAS.map((c) => {
                const porcentaje = saldoTotalGlobal > 0 ? ((saldosCuentas[c.id] || 0) / saldoTotalGlobal) * 100 : 0;
                if (porcentaje <= 0) return null;
                return <div key={c.id} style={{ width: `${porcentaje}%`, height: "100%", background: c.color }} />;
              })}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 12px" }}>
              {CUENTAS.map((c) => (
                <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11 }}>
                  <div style={{ width: 7, height: 7, borderRadius: "50%", background: c.color }} />
                  <span style={{ color: B.texto, flex: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{c.nombre}</span>
                  <span style={{ color: B.textoSub }}>{pct(saldosCuentas[c.id] || 0, saldoTotalGlobal)}</span>
                </div>
              ))}
            </div>
          </Card>

          <div style={{ display: "flex", flexDirection: "column", gap: 10, width: "100%" }}>
            <Lbl style={{ marginBottom: 2 }}>ESTADO DE CUENTAS AL PERIODO</Lbl>
            {CUENTAS.map((c) => (
              <div key={c.id} style={{ background: B.fondoCard, border: `1px solid ${B.fondoBorde}`, borderRadius: 16, padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <IconoCustom source={SVG_CUENTAS[c.id] || c.emoji} size={18} />
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 700, color: B.texto }}>{c.nombre}</div>
                    <div style={{ fontSize: 10, color: B.textoSub }}>No. {c.num}</div>
                  </div>
                </div>
                <div style={{ fontSize: 15, fontWeight: 700, color: c.color }}>
                  {fmt(saldosCuentas[c.id] || 0)}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─── PESTAÑA DISTRIBUIR EXCEL STYLE ──────────────────────────────────────────
    function Distribucion({ onGuardar, todasCats = [] }) {
      const [fecha, setFecha] = useState(hoy());
      const [ingreso, setIngreso] = useState("");
      const [items, setItems] = useState([{ cat: "", monto: "" }]);
      const [ok, setOk] = useState(false);

      const totalIng = parseFloat(ingreso) || 0;
      const totalDist = items.reduce((s, i) => s + (parseFloat(i.monto) || 0), 0);
      const diff = totalIng - totalDist;

      const addItem = () => setItems([...items, { cat: "", monto: "" }]);
      const upd = (i, f, v) => { const a = [...items]; a[i][f] = v; setItems(a); };
      const rem = (i) => setItems(items.filter((_, x) => x !== i));

      const guardar = () => {
        if (!fecha || totalIng === 0 || Math.abs(diff) > 0.01) return;
        onGuardar({
          id: Date.now(),
          fecha,
          ingreso: totalIng,
          items: items.filter((i) => i.cat && i.monto).map((i) => ({ ...i, monto: parseFloat(i.monto) || 0 })),
        });
        setIngreso(""); setItems([{ cat: "", monto: "" }]);
        setOk(true); setTimeout(() => setOk(false), 3000);
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 14, width: "100%" }}>
          <Lbl>ASIGNACIÓN COMPLETA DEL DÍA</Lbl>
          {ok && <Card style={{ background: "#14532D", textAlign: "center", color: "#22C55E", fontWeight: 700 }}>✅ Guardado e indexado en balances</Card>}

          <Card><Lbl>FECHA CONTABLE</Lbl><Inp type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} /></Card>
          <Card glow><Lbl>INGRESO BRUTO EVALUADO</Lbl><Inp type="number" inputMode="decimal" placeholder="RD$ 0.00" value={ingreso} onChange={(e) => setIngreso(e.target.value)} style={{ fontSize: 20, fontWeight: 700, color: B.celeste }} /></Card>

          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
              <Lbl style={{ marginBottom: 0 }}>DISTRIBUCIÓN DE FONDOS</Lbl>
              <button onClick={addItem} style={{ background: `${B.azulOscuro}33`, border: `1px solid ${B.azulOscuro}`, color: B.celeste, borderRadius: 8, padding: "4px 12px", fontSize: 12, cursor: "pointer" }}>+ Fila</button>
            </div>
            {items.map((it, i) => (
              <div key={i} style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 8 }}>
                <Sel value={it.cat} onChange={(e) => upd(i, "cat", e.target.value)} style={{ flex: 2 }}>
                  <option value="">Concepto...</option>
                  {CUENTAS.map((cu) => (
                    <optgroup key={cu.id} label={`${cu.nombre}`}>
                      {todasCats.filter((c) => c.cuenta === cu.id).map((c) => (
                        <option key={c.nombre} value={c.nombre}>{c.nombre}</option>
                      ))}
                    </optgroup>
                  ))}
                </Sel>
                <Inp type="number" inputMode="decimal" placeholder="RD$" value={it.monto} onChange={(e) => upd(i, "monto", e.target.value)} style={{ flex: 1.5 }} />
                <button onClick={() => rem(i)} style={{ background: "transparent", border: "none", color: "#EF4444", fontSize: 20, cursor: "pointer" }}>×</button>
              </div>
            ))}
            {totalIng > 0 && (
              <div style={{ fontSize: 13, color: Math.abs(diff) < 0.01 ? "#22C55E" : diff > 0 ? "#F59E0B" : "#EF4444", fontWeight: 600, marginTop: 8 }}>
                {Math.abs(diff) < 0.01 ? "✓ Distribución Cuadrada" : diff > 0 ? `Por asignar: ${fmt(diff)}` : `Excedido: ${fmt(Math.abs(diff))}`}
              </div>
            )}
          </Card>
          <Btn onClick={guardar} disabled={totalIng === 0 || Math.abs(diff) > 0.01}>💾 Procesar Distribución</Btn>
        </div>
      );
    }

    // ─── PESTAÑA PRESUPUESTO SEMANAL (CON FILTRADO DE MES INTEGRADO) ──────────────
    function Pagos({ pagos = [], setPagos, mesFiltro }) {
      const [sem, setSem] = useState(1);
      const [editMode, setEditMode] = useState(false);
      const [nuevo, setNuevo] = useState({ semana: 1, nombre: "", monto: "", cuenta: "general" });

      // Filtrar los pagos correspondientes al mes global seleccionado
      const pagosDelMes = pagos.filter((p) => p.mes === mesFiltro);
      const fSem = (s) => pagosDelMes.filter((p) => p.semana === s);
      const totS = (s) => fSem(s).reduce((a, p) => a + (parseFloat(p.monto) || 0), 0);

      const togglePago = (id) => setPagos(pagos.map((p) => (p.id === id ? { ...p, ok: !p.ok } : p)));
      const eliminarItem = (id) => setPagos(pagos.filter((p) => p.id !== id));
      
      const agregarItem = () => {
        if (!nuevo.nombre || !nuevo.monto) return;
        setPagos([...pagos, { 
          id: Date.now().toString(), 
          semana: nuevo.semana, 
          nombre: nuevo.nombre, 
          monto: parseFloat(nuevo.monto) || 0, 
          cuenta: nuevo.cuenta, 
          ok: false,
          mes: mesFiltro 
        }]);
        setNuevo({ semana: sem, nombre: "", monto: "", cuenta: "general" });
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 14, width: "100%" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 20, fontWeight: 700, color: B.texto }}>Presupuesto Semanal</div>
              <div style={{ fontSize: 12, color: B.textoSub }}>Egresos obligatorios programados</div>
            </div>
            <button onClick={() => setEditMode(!editMode)} style={{ background: "transparent", border: `1px solid ${B.celeste}`, color: B.celeste, padding: "6px 12px", borderRadius: 10, fontSize: 13, cursor: "pointer" }}>
              {editMode ? "✓ Ver Panel" : "✏️ Editar"}
            </button>
          </div>

          {!editMode ? (
            <>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6, width: "100%" }}>
                {[1, 2, 3, 4].map((s) => (
                  <button key={s} onClick={() => setSem(s)} style={{ background: sem === s ? "#1A65A433" : B.fondoCard, border: `1px solid ${sem === s ? B.azulOscuro : B.fondoBorde}`, borderRadius: 12, padding: 8, color: B.texto, cursor: "pointer" }}>
                    <div style={{ fontSize: 9, color: B.textoSub }}>SEM {s}</div>
                    <div style={{ fontSize: 11, fontWeight: 700, marginTop: 2 }}>{fmt(totS(s)).split(".")[0]}</div>
                  </button>
                ))}
              </div>
              <Card>
                <Lbl>CUOTAS SEMANA {sem}</Lbl>
                {fSem(sem).length === 0 && <div style={{ fontSize: 13, color: B.textoSub, textAlign: "center", padding: "10px 0" }}>No hay rubros programados.</div>}
                {fSem(sem).map((p) => (
                  <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: `1px solid ${B.fondoBorde}44` }}>
                    <button onClick={() => togglePago(p.id)} style={{ width: 22, height: 22, borderRadius: 6, border: `2px solid ${p.ok ? "#22C55E" : B.fondoBorde}`, background: p.ok ? "#22C55E" : "transparent", color: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12 }}>
                      {p.ok ? "✓" : ""}
                    </button>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, color: p.ok ? B.textoSub : B.texto }}>{p.nombre}</div>
                      <div style={{ fontSize: 9, color: B.textoSub, textTransform: "uppercase" }}>Salida: {p.cuenta}</div>
                    </div>
                    <span style={{ fontSize: 14, fontWeight: 700, color: p.ok ? B.textoSub : B.texto }}>{fmt(p.monto)}</span>
                  </div>
                ))}
              </Card>
            </>
          ) : (
            <Card style={{ border: `1px solid ${B.azulMedio}` }}>
              <Lbl style={{ color: B.celeste }}>ORGANIZADOR COMPLETO DEL MES</Lbl>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 6 }}>
                  <Sel value={nuevo.semana} onChange={(e) => setNuevo({ ...nuevo, semana: parseInt(e.target.value) })}>
                    <option value={1}>Sem 1</option><option value={2}>Sem 2</option><option value={3}>Sem 3</option><option value={4}>Sem 4</option>
                  </Sel>
                  <Inp placeholder="Gasto u Obligación" value={nuevo.nombre} onChange={(e) => setNuevo({ ...nuevo, nombre: e.target.value })} />
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr", gap: 6 }}>
                  <Sel value={nuevo.cuenta} onChange={(e) => setNuevo({ ...nuevo, cuenta: e.target.value })}>
                    {CUENTAS.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                  </Sel>
                  <Inp type="number" placeholder="RD$" value={nuevo.monto} onChange={(e) => setNuevo({ ...nuevo, monto: e.target.value })} />
                </div>
                <Btn onClick={agregarItem}>+ Insertar Obligación</Btn>
              </div>

              <Lbl style={{ marginTop: 14 }}>RUBROS ASIGNADOS AL MOMENTO</Lbl>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 200, overflowY: "auto" }}>
                {pagosDelMes.map((p) => (
                  <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 6, background: "#091424", padding: "8px 10px", borderRadius: 10 }}>
                    <span style={{ fontSize: 10, color: B.textoSub, minWidth: 26 }}>S{p.semana}</span>
                    <span style={{ flex: 1, fontSize: 13, color: B.texto, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.nombre}</span>
                    <span style={{ fontSize: 12, fontWeight: 700, color: B.celeste }}>{fmt(p.monto).split(".")[0]}</span>
                    <button onClick={() => eliminarItem(p.id)} style={{ background: "transparent", border: "none", color: "#EF4444", fontSize: 18, cursor: "pointer" }}>×</button>
                  </div>
                ))}
              </div>
            </Card>
          )}
        </div>
      );
    }

    // ─── PESTAÑA HISTORIAL (CON FILTRADO DE MES TOTALMENTE CORREGIDO) ───────────
    function Historial({ registros = [], setRegistros, todasCats = [], mesFiltro }) {
      const [editId, setEditId] = useState(null);
      const [editFecha, setEditFecha] = useState("");
      const [editIngreso, setEditIngreso] = useState("");
      const [editItems, setEditItems] = useState([]);

      // Filtrar el historial cronológico para mostrar solo las distribuciones del mes actual activo
      const registrosDelMes = registros.filter((r) => r.fecha.startsWith(mesFiltro));

      const comenzarEdicion = (reg) => {
        setEditId(reg.id);
        setEditFecha(reg.fecha);
        setEditIngreso(reg.ingreso);
        setEditItems([...reg.items]);
      };

      const guardarEdicion = () => {
        const totalBruto = parseFloat(editIngreso) || 0;
        const totalDist = editItems.reduce((acc, current) => acc + (parseFloat(current.monto) || 0), 0);
        
        if (Math.abs(totalBruto - totalDist) > 0.02) {
          alert(`Error: La distribución no está cuadrada.\nIngreso Bruto: ${fmt(totalBruto)}\nSuma: ${fmt(totalDist)}`);
          return;
        }

        setRegistros(registros.map(r => r.id === editId ? {
          ...r,
          fecha: editFecha,
          ingreso: totalBruto,
          items: editItems.filter(i => i.cat && i.monto).map(i => ({ ...i, monto: parseFloat(i.monto) || 0 }))
        } : r));
        setEditId(null);
      };

      const eliminarRegistro = (id) => {
        if (confirm("¿Estás seguro de que deseas eliminar esta distribución? Esto afectará los balances globales en tiempo real.")) {
          setRegistros(registros.filter(r => r.id !== id));
        }
      };

      const updItem = (index, field, value) => {
        const copy = [...editItems];
        copy[index][field] = value;
        setEditItems(copy);
      };

      const addItem = () => setEditItems([...editItems, { cat: "", monto: "" }]);
      const remItem = (index) => setEditItems(editItems.filter((_, idx) => idx !== index));

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 14, width: "100%" }}>
          <Lbl>HISTORIAL DE DISTRIBUCIONES DEL PERIODO</Lbl>
          
          {editId && (
            <Card style={{ border: `1px solid ${B.celeste}` }}>
              <Lbl style={{ color: B.celeste }}>EDITAR REGISTRO CONTABLE</Lbl>
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 12 }}>
                <div>
                  <Lbl>Fecha</Lbl>
                  <Inp type="date" value={editFecha} onChange={(e) => setEditFecha(e.target.value)} />
                </div>
                <div>
                  <Lbl>Ingreso Bruto</Lbl>
                  <Inp type="number" value={editIngreso} onChange={(e) => setEditIngreso(e.target.value)} />
                </div>
                <div>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                    <Lbl style={{ marginBottom: 0 }}>Filas Distribuidas</Lbl>
                    <button onClick={addItem} style={{ background: `${B.azulOscuro}33`, border: `1px solid ${B.azulOscuro}`, color: B.celeste, borderRadius: 6, padding: "2px 8px", fontSize: 11 }}>+ Fila</button>
                  </div>
                  {editItems.map((it, idx) => (
                    <div key={idx} style={{ display: "flex", gap: 4, alignItems: "center", marginBottom: 6 }}>
                      <Sel value={it.cat} onChange={(e) => updItem(idx, "cat", e.target.value)} style={{ flex: 2, padding: "6px 10px", fontSize: 13 }}>
                        <option value="">Seleccionar...</option>
                        {CUENTAS.map((cu) => (
                          <optgroup key={cu.id} label={cu.nombre}>
                            {todasCats.filter((c) => c.cuenta === cu.id).map((c) => (
                              <option key={c.nombre} value={c.nombre}>{c.nombre}</option>
                            ))}
                          </optgroup>
                        ))}
                      </Sel>
                      <Inp type="number" value={it.monto} onChange={(e) => updItem(idx, "monto", e.target.value)} style={{ flex: 1.5, padding: "6px 10px", fontSize: 13 }} />
                      <button onClick={() => remItem(idx)} style={{ background: "transparent", border: "none", color: "#EF4444", fontSize: 18 }}>×</button>
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                  <Btn onClick={guardarEdicion} style={{ padding: 10, fontSize: 13 }}>✓ Guardar Cambios</Btn>
                  <Btn onClick={() => setEditId(null)} v="ghost" style={{ padding: 10, fontSize: 13 }}>Cancelar</Btn>
                </div>
              </div>
            </Card>
          )}

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {registrosDelMes.length === 0 && (
              <div style={{ color: B.textoSub, textAlign: "center", padding: 20, fontSize: 14 }}>No hay distribuciones registradas en este mes.</div>
            )}
            {[...registrosDelMes].reverse().map((r) => (
              <Card key={r.id} style={{ padding: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
                  <div>
                    <span style={{ fontSize: 14, fontWeight: 700, color: B.texto }}>{r.fecha.split("-").reverse().join("/")}</span>
                    <div style={{ fontSize: 11, color: B.textoSub, marginTop: 2 }}>Monto Bruto: <span style={{ color: B.celeste, fontWeight: 600 }}>{fmt(r.ingreso)}</span></div>
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => comenzarEdicion(r)} style={{ background: "transparent", border: "none", color: B.celeste, fontSize: 14, cursor: "pointer" }}>✏️</button>
                    <button onClick={() => eliminarRegistro(r.id)} style={{ background: "transparent", border: "none", color: "#EF4444", fontSize: 14, cursor: "pointer" }}>🗑️</button>
                  </div>
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 4, background: "#06111F", padding: 8, borderRadius: 10 }}>
                  {r.items.map((it, idx) => (
                    <div key={idx} style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                      <span style={{ color: B.texto }}>• {it.cat}</span>
                      <span style={{ color: B.textoSub, fontWeight: 600 }}>{fmt(it.monto)}</span>
                    </div>
                  ))}
                </div>
              </Card>
            ))}
          </div>
        </div>
      );
    }

    // ─── PESTAÑA SEPARADA: GESTIÓN DE CUENTAS (BALANCES Y SUBCATEGORÍAS) ───
    function CuentasConfig({ balancesIniciales, setBalancesIniciales, todasCats, setTodasCats }) {
      const [nuevaSubcat, setNuevaSubcat] = useState("");
      const [cuentaSeleccionada, setCuentaSeleccionada] = useState("general");

      const handleBalanceChange = (cuentaId, valor) => {
        setBalancesIniciales({
          ...balancesIniciales,
          [cuentaId]: parseFloat(valor) || 0
        });
      };

      const agregarSubcategoria = () => {
        if (!nuevaSubcat.trim()) return;
        
        if (todasCats.some(c => c.nombre.toLowerCase() === nuevaSubcat.trim().toLowerCase())) {
          alert("Ya existe una subcategoría con este mismo nombre.");
          return;
        }

        const cuentaObj = CUENTAS.find(c => c.id === cuentaSeleccionada);
        const nueva = {
          id: "sub_" + Date.now(),
          nombre: nuevaSubcat.trim(),
          cuenta: cuentaSeleccionada,
          color: cuentaObj ? cuentaObj.color : "#4EA5E0"
        };

        setTodasCats([...todasCats, nueva]);
        setNuevaSubcat("");
      };

      const eliminarSubcategoria = (id) => {
        if (confirm("¿Estás seguro de eliminar esta subcategoría?")) {
          setTodasCats(todasCats.filter(c => c.id !== id));
        }
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 16, width: "100%" }}>
          <div>
            <div style={{ fontSize: 20, fontWeight: 700, color: B.texto }}>Panel de Cuentas</div>
            <div style={{ fontSize: 12, color: B.textoSub }}>Balances iniciales del mes y subcategorías</div>
          </div>

          <Card glow>
            <Lbl style={{ color: B.celeste }}>BALANCES INICIALES DEL MES</Lbl>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {CUENTAS.map((c) => (
                <div key={c.id} style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", alignItems: "center", gap: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                    <IconoCustom source={SVG_CUENTAS[c.id] || c.emoji} size={14} />
                    <span style={{ fontSize: 13, color: B.texto, fontWeight: 600 }}>{c.nombre}</span>
                  </div>
                  <Inp 
                    type="number"
                    inputMode="decimal"
                    placeholder="RD$ 0.00" 
                    value={balancesIniciales[c.id] || ""} 
                    onChange={(e) => handleBalanceChange(c.id, e.target.value)}
                    style={{ padding: "8px 12px", fontSize: 13, textAlign: "right" }}
                  />
                </div>
              ))}
            </div>
          </Card>

          <Card>
            <Lbl>CREAR NUEVA SUBCATEGORÍA</Lbl>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 6 }}>
                <Inp 
                  placeholder="Ej: Gasoil Extra" 
                  value={nuevaSubcat} 
                  onChange={(e) => setNuevaSubcat(e.target.value)} 
                  style={{ fontSize: 13, padding: "8px 12px" }}
                />
                <Sel 
                  value={cuentaSeleccionada} 
                  onChange={(e) => setCuentaSeleccionada(e.target.value)}
                  style={{ fontSize: 13, padding: "8px 12px" }}
                >
                  {CUENTAS.map(c => (
                    <option key={c.id} value={c.id}>{c.nombre}</option>
                  ))}
                </Sel>
              </div>
              <Btn onClick={agregarSubcategoria} style={{ padding: "10px", fontSize: 13 }}>＋ Agregar Subcategoría</Btn>
            </div>
          </Card>

          <Card>
            <Lbl>SUBCATEGORÍAS CONFIGURADAS</Lbl>
            <div style={{ display: "flex", flexDirection: "column", gap: 12, maxHeight: 260, overflowY: "auto" }}>
              {CUENTAS.map((cu) => {
                const subCatsCuenta = todasCats.filter(c => c.cuenta === cu.id);
                return (
                  <div key={cu.id} style={{ borderBottom: `1px solid ${B.fondoBorde}44`, paddingBottom: 8 }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: cu.color, marginBottom: 4, display: "flex", alignItems: "center", gap: 4 }}>
                      <IconoCustom source={SVG_CUENTAS[cu.id] || cu.emoji} size={11} /> {cu.nombre.toUpperCase()}
                    </div>
                    {subCatsCuenta.length === 0 ? (
                      <div style={{ fontSize: 12, color: B.textoSub, paddingLeft: 6 }}>Sin subcategorías registradas.</div>
                    ) : (
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, paddingLeft: 4 }}>
                        {subCatsCuenta.map(c => (
                          <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 4, background: "#091424", border: `1px solid ${B.fondoBorde}`, borderRadius: 8, padding: "4px 8px", fontSize: 12, color: B.texto }}>
                            <span>{c.nombre}</span>
                            <button onClick={() => eliminarSubcategoria(c.id)} style={{ background: "transparent", border: "none", color: "#EF4444", fontSize: 14, cursor: "pointer", padding: "0 2px" }}>×</button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </Card>
        </div>
      );
    }

    // ─── COMPONENTE CENTRAL DE LA APLICACIÓN (APP CON FILTRO GLOBAL) ─────────────
    function App() {
      const [tab, setTab] = useStore("ar_tab_2026", "inicio");
      const [registros, setRegistros] = useStore("ar_registros_2026", []);
      const [pagos, setPagos] = useStore("ar_pagos_2026", []);
      const [todasCats, setTodasCats] = useStore("ar_cats_2026", INITIAL_CATS);
      const [balancesIniciales, setBalancesIniciales] = useStore("ar_balances_2026", INITIAL_BALANCES);
      
      // ESTADO DEL MES FILTRO: Global e inmune a reinicios involuntarios
      const [mesFiltro, setMesFiltro] = useStore("ar_mes_filtro_2026", obtenerMesActual());

      // Códigos SVG Vectoriales puros suministrados por el usuario para los Tabs inferiores
      const svgInicio = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16v5"/><path d="M16 14.639V21"/><path d="M20 10.656V21"/><path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15"/><path d="M4 18.463V21"/><path d="M8 14.656V21"/></svg>`;
      const svgDist = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/></svg>`;
      const svgPagos = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></svg>`;
      const svgHist = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>`;
      const svgCuentas = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>`;

      // GESTIÓN INTELIGENTE DE CASILLAS POR MES (MIGRACIÓN Y AUTO-POBLADO DESMARCADO)
      useEffect(() => {
        if (pagos.length > 0 && !pagos[0].mes) {
          // Migrar registros antiguos si existían
          const mesAct = obtenerMesActual();
          setPagos(pagos.map(p => ({ ...p, mes: p.mes || mesAct })));
        } else {
          // Si cambiamos a un mes que no tiene pagos creados aún (ej. Julio), se clona la plantilla totalmente limpia
          const tienePagosParaMes = pagos.some(p => p.mes === mesFiltro);
          if (!tienePagosParaMes) {
            const nuevosPagosMes = INITIAL_PAGOS.map(p => ({
              ...p,
              id: p.id + "_" + mesFiltro,
              mes: mesFiltro,
              ok: false // Nacen desmarcados para el nuevo mes
            }));
            setPagos(prev => [...prev, ...nuevosPagosMes]);
          }
        }
      }, [mesFiltro, pagos.length]);

      return (
        <div style={{ minHeight: "100vh", backgroundColor: B.fondo, color: B.texto, boxSizing: "border-box", display: "flex", flexDirection: "column" }}>
          
          {/* HEADER PREMIUM GLOBAL (CON FILTRADO ESTABLE INTEGRADO) */}
          <div style={{ background: "linear-gradient(to bottom, #0A1422, #07101C)", borderBottom: `1px solid ${B.fondoBorde}`, padding: "40px 20px 16px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, zIndex: 100 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div style={{ width: 10, height: 10, borderRadius: "50%", backgroundColor: B.celeste, boxShadow: `0 0 8px ${B.celeste}` }} />
              <span style={{ fontSize: 16, fontWeight: 800, letterSpacing: "0.05em", color: "#fff" }}>AGUA RUTH</span>
            </div>
            <div style={{ width: 135 }}>
              <Sel value={mesFiltro} onChange={(e) => setMesFiltro(e.target.value)} style={{ padding: "6px 10px", fontSize: 12, background: "#111E2E", borderRadius: 8, height: 32 }}>
                {MESES_2026.map((m) => (
                  <option key={m.val} value={m.val}>{m.label}</option>
                ))}
              </Sel>
            </div>
          </div>

          {/* ÁREA DE CONTENIDO */}
          <div style={{ flex: 1, padding: "16px 16px 100px 16px", display: "flex", flexDirection: "column", width: "100%", boxSizing: "border-box" }}>
            {tab === "inicio" && <Dashboard registros={registros} pagos={pagos} todasCats={todasCats} balancesIniciales={balancesIniciales} mesFiltro={mesFiltro} />}
            {tab === "distribuir" && <Distribucion onGuardar={(r) => setRegistros([...registros, r])} todasCats={todasCats} />}
            {tab === "pagos" && <Pagos pagos={pagos} setPagos={setPagos} mesFiltro={mesFiltro} />}
            {tab === "historial" && <Historial registros={registros} setRegistros={setRegistros} todasCats={todasCats} mesFiltro={mesFiltro} />}
            {tab === "cuentas" && <CuentasConfig balancesIniciales={balancesIniciales} setBalancesIniciales={setBalancesIniciales} todasCats={todasCats} setTodasCats={setTodasCats} />}
          </div>

          {/* BARRA DE NAVEGACIÓN INFERIOR (TABS CON SUS SVG ORIGINALES) */}
          <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, backgroundColor: "#091424F2", backdropFilter: "blur(20px)", borderTop: `1px solid ${B.fondoBorde}`, display: "flex", justifyContent: "space-around", padding: "10px 10px calc(10px + env(safe-area-inset-bottom)) 10px", zIndex: 1000 }}>
            {[
              { id: "inicio", label: "Inicio", svg: svgInicio },
              { id: "distribuir", label: "Distribuir", svg: svgDist },
              { id: "pagos", label: "Semanal", svg: svgPagos },
              { id: "historial", label: "Historial", svg: svgHist },
              { id: "cuentas", label: "Cuentas", svg: svgCuentas }
            ].map((t) => {
              const act = tab === t.id;
              return (
                <button 
                  key={t.id} 
                  onClick={() => setTab(t.id)} 
                  style={{ background: "transparent", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 5, color: act ? B.celeste : B.textoSub, cursor: "pointer", transition: "all 0.2s ease", padding: "6px 0", flex: 1, outline: "none" }}
                >
                  <IconoCustom source={t.svg} size={20} />
                  <span style={{ fontSize: 10, fontWeight: act ? 700 : 500, letterSpacing: "0.02em" }}>{t.label}</span>
                </button>
              );
            })}
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
