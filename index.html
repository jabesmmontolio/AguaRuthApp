// Hook para variables que SOLO se guardan de manera local (filtros visuales del dispositivo)
function useLocalStore(key, init) {
  const [v, set] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; }
    catch { return init; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} }, [key, v]);
  return [v, set];
}

// Hook de Sincronización Realtime vía Firebase para bases de datos compartidas
function useFirebaseStore(key, init) {
  const [v, setV] = useState(init);
  const [isLoaded, setIsLoaded] = useState(false);

  useEffect(() => {
    if (!window.db) return;
    const dataRef = window.dbRef(window.db, key);
    
    const unsubscribe = window.dbOnValue(dataRef, (snapshot) => {
      let data = snapshot.val();
      
      // Asegurar que los Arrays no se destruyan si Firebase los parsea como objetos anónimos
      if (data && typeof data === 'object' && !Array.isArray(data) && Array.isArray(init)) {
        data = Object.values(data);
      }

      if (snapshot.exists() && data) {
        setV(data);
      } else {
        setV(init);
      }
      setIsLoaded(true);
    });

    return () => unsubscribe();
  }, [key]);

  const setValue = (newValue) => {
    const valueToStore = typeof newValue === "function" ? newValue(v) : newValue;
    setV(valueToStore); // Activa respuesta rápida UI
    if (window.db) {
      window.dbSet(window.dbRef(window.db, key), valueToStore);
    }
  };

  return [v, setValue, isLoaded];
}

const calcularSaldos = (mesFiltro, todasCats, balancesIniciales, registros, pagos, transferencias) => {
  const statsCat = {};
  const statsCuentas = {};
  const pagMesSinCatPorCuenta = {};

  CUENTAS.forEach(c => {
    statsCuentas[c.id] = { restante: 0 };
    pagMesSinCatPorCuenta[c.id] = 0;
  });

  const pagoAcat = {};
  pagos.filter(p => p.ok && p.mes === mesFiltro).forEach(p => {
    if (p.catId) {
      pagoAcat[p.id] = p.catId;
    } else {
      const np = p.nombre.trim().toLowerCase();
      let matchedCat = null;
      if (p.cuenta === "nomina" && np.startsWith("nómina -")) {
        matchedCat = todasCats.find(c => c.cuenta === "nomina" && c.nombre === (p.semana === 2 ? "1ra Quincena" : p.semana === 4 ? "2da Quincena" : ""));
      } else {
        matchedCat = todasCats.find(c => c.cuenta === (p.cuenta || "general") && c.nombre.trim().toLowerCase() === np);
      }

      if (matchedCat) {
        pagoAcat[p.id] = matchedCat.id; 
      } else {
        const holdCat = todasCats.find(c => c.cuenta === (p.cuenta || "general") && (c.nombre.toLowerCase().includes("hold") || c.nombre.toLowerCase().includes("fondo")));
        if (holdCat) {
          pagoAcat[p.id] = holdCat.id;
        } else {
          pagoAcat[p.id] = `__sin_cat_${p.cuenta || "general"}`;
        }
      }
    }
  });

  const balancesMes = balancesIniciales[mesFiltro] || {};

  todasCats.forEach(cat => {
    const inicial = parseFloat(balancesMes[cat.id] || 0);
    const esHold = cat.nombre.toLowerCase().includes("hold") || cat.nombre.toLowerCase().includes("fondo");

    const regMes = registros.filter(r => r.fecha.slice(0, 7) === mesFiltro);
    const pagMes = pagos.filter(p => p.ok && p.mes === mesFiltro);
    const trMes = transferencias.filter(t => t.mes === mesFiltro);

    const sumReg = (arr) => arr.reduce((sum, r) => sum + (r.items || []).filter(i => i.cat === cat.id || i.cat === cat.nombre).reduce((s, i) => s + parseFloat(i.monto||0), 0), 0);
    const sumTrIn = (arr) => arr.filter(t => t.destino === cat.id || t.destino === cat.nombre).reduce((s, t) => s + parseFloat(t.monto||0), 0);
    const sumTrOut = (arr) => arr.filter(t => t.origen === cat.id || t.origen === cat.nombre).reduce((s, t) => s + parseFloat(t.monto||0), 0);
    const sumPag = (arr) => arr.filter(p => pagoAcat[p.id] === cat.id).reduce((sum, p) => sum + parseFloat(p.monto||0), 0);

    const ingresosMes = sumReg(regMes) + sumTrIn(trMes) - sumTrOut(trMes);
    const distribucion = inicial + ingresosMes;
    const utilMes = sumPag(pagMes);
    const restante = distribucion - utilMes;

    statsCat[cat.id] = { distribucion, utilMes, restante, esHold };
    if(statsCuentas[cat.cuenta]) statsCuentas[cat.cuenta].restante += restante;
  });

  pagos.filter(p => p.ok && p.mes === mesFiltro).forEach(p => {
    if(pagoAcat[p.id] && pagoAcat[p.id].startsWith("__sin_cat_")) {
      const cId = p.cuenta || "general";
      pagMesSinCatPorCuenta[cId] += parseFloat(p.monto||0);
    }
  });

  return { statsCat, statsCuentas, pagMesSinCatPorCuenta };
};

function InputDecimalContable({ value, onChange, style = {} }) {
  const [focused, setFocused] = useState(false);
  const [rawStr, setRawStr] = useState(value === 0 || value == null ? "" : String(value));
  useEffect(() => { if (!focused) setRawStr(value === 0 || value == null ? "" : String(value)); }, [value, focused]);
  
  const displayValue = focused ? rawStr : (value ? FORMATEADOR_MONEDA.format(value) : "");
  
  const handleChange = (e) => {
    const v = e.target.value.replace(/[^0-9.]/g, "");
    setRawStr(v);
    const parsed = parseFloat(v);
    onChange(isNaN(parsed) ? 0 : parsed);
  };
  const handleFocus = () => { setFocused(true); setRawStr(value === 0 || value == null ? "" : String(value)); };
  const handleBlur = () => { setFocused(false); };
  
  return (
    <div style={{ display: "flex", alignItems: "center", background: "#091526", border: "1px solid #152233", borderRadius: 12, overflow: "hidden", ...style }}>
      <span style={{ padding: "8px 6px 8px 10px", color: "#4F7A99", fontSize: 12, fontWeight: 700, whiteSpace: "nowrap", userSelect: "none" }}>RD$</span>
      <input type="text" inputMode="decimal" placeholder="0.00" value={displayValue} onChange={handleChange} onFocus={handleFocus} onBlur={handleBlur} style={{ background: "transparent", border: "none", padding: "8px 10px 8px 2px", color: "#E8F4FD", fontSize: 14, width: "100%", boxSizing: "border-box", outline: "none", textAlign: "right", ...(style.inputStyle || {}) }} />
    </div>
  );
}

function IconoCustom({ source, size = 18 }) {
  if (!source) return null;
  if (source.startsWith("http")) return <img src={source} style={{ width: size, height: size, objectFit: "contain" }} alt="icon" />;
  if (source.trim().startsWith("<svg")) return <div style={{ width: size, height: size, display: "flex", alignItems: "center", justifyContent: "center" }} dangerouslySetInnerHTML={{ __html: source }} />;
  return <span style={{ fontSize: size }}>{source}</span>;
}

}

}

function Inp({ style = {}, type = "text", inputMode, ...p }) {
  return <input type={type} inputMode={inputMode} {...p} style={{ background: "#091526", border: `1px solid ${B.fondoBorde}`, borderRadius: 12, padding: "11px 14px", color: B.texto, fontSize: 15, width: "100%", boxSizing: "border-box", outline: "none", ...style }} />;
}

function Sel({ children, style = {}, ...p }) {
  return <select {...p} style={{ background: "#091526", border: `1px solid ${B.fondoBorde}`, borderRadius: 12, padding: "11px 14px", color: B.texto, fontSize: 14, width: "100%", boxSizing: "border-box", outline: "none", ...style }}>{children}</select>;
}

function Btn({ children, onClick, v = "primary", style = {}, disabled = false }) {
  const vs = {
    primary: { background: `linear-gradient(135deg, ${B.azulOscuro}, ${B.azulMedio})`, color: "#fff", border: "none" },
    ghost: { background: "transparent", color: B.celeste, border: `1px solid ${B.celeste}44` },
    danger: { background: "linear-gradient(135deg, #DC2626, #EF4444)", color: "#fff", border: "none" }
  };
  return <button onClick={onClick} disabled={disabled} style={{ ...vs[v], borderRadius: 14, padding: "13px 20px", fontSize: 15, fontWeight: 600, cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.45 : 1, width: "100%", boxSizing: "border-box", ...style }}>{children}</button>;
}

function DonutChart({ data, size = 120 }) {
  const radius = 15.9155;
  let currentOffset = 0;

  return (
    <svg viewBox="0 0 42 42" width={size} height={size} style={{ transform: "rotate(-90deg)", overflow: "visible" }}>
      <circle cx="21" cy="21" r={radius} fill="none" stroke="#152233" strokeWidth="5" />
      {data.map((item, i) => {
        if (item.pct <= 0) return null;
        const strokeDasharray = `${item.pct} ${100 - item.pct}`;
        const strokeDashoffset = -currentOffset;
        currentOffset += item.pct;
        return (
          <circle
            key={i}
            cx="21" cy="21" r={radius}
            fill="none"
            stroke={item.color}
            strokeWidth="5"
            strokeDasharray={strokeDasharray}
            strokeDashoffset={strokeDashoffset}
            strokeLinecap="round"
            style={{ transition: "stroke-dashoffset 0.5s ease" }}
          />
        );
      })}
    </svg>
  );
}

function TablaDesgloseCuenta({ cuentaId, todasCats, saldosGlobales }) {
  const cuentaObj = CUENTAS.find(c => c.id === cuentaId);
  if (!cuentaObj) return null;
  const subcats = todasCats.filter(c => c.cuenta === cuentaId);
  
  let totalDist = 0, totalUtil = 0, totalRest = 0;
  
  const filas = subcats.map(cat => {
    const st = saldosGlobales.statsCat[cat.id] || { distribucion: 0, utilMes: 0, restante: 0, esHold: false };
    totalDist += st.distribucion; totalUtil += st.utilMes; totalRest += st.restante;
    return { concepto: cat.nombre, dist: st.distribucion, util: st.utilMes, restante: st.restante, esHold: st.esHold };
  });

  const sinCat = saldosGlobales.pagMesSinCatPorCuenta[cuentaId] || 0;
  if (sinCat > 0) { totalUtil += sinCat; totalRest -= sinCat; }

  const nombreCorto = cuentaObj.nombre.length > 16 ? cuentaObj.nombre.slice(0, 15) + "…" : cuentaObj.nombre;

  return (
    <div style={{ marginTop: 10, background: "#091424", borderRadius: 12, border: "1px solid #1A65A466", width: "100%", boxSizing: "border-box", overflow: "hidden" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#11253E", padding: "8px 10px", borderBottom: "2px solid #152233", overflow: "hidden" }}>
        <div style={{ display: "flex", flexDirection: "column", overflow: "hidden", flex: 1, minWidth: 0 }}>
          <span style={{ fontSize: 9, color: B.textoSub, fontWeight: 600, whiteSpace: "nowrap" }}>No. {cuentaObj.num}</span>
          <span style={{ fontSize: 11, fontWeight: 700, color: "#fff", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>Agua Ruth / {nombreCorto}</span>
        </div>
        <div style={{ fontSize: 11, fontWeight: 700, color: B.celeste, whiteSpace: "nowrap", paddingLeft: 6 }}>{fmt(totalRest)}</div>
      </div>
      <table className="tabla-desglose" style={{ width: "100%", borderCollapse: "collapse", fontSize: 10, textAlign: "left", tableLayout: "fixed" }}>
        <colgroup>
          <col style={{ width: "38%" }} />
          <col style={{ width: "21%" }} />
          <col style={{ width: "18%" }} />
          <col style={{ width: "23%" }} />
        </colgroup>
        <thead>
          <tr style={{ background: "#0F1C2E", color: B.textoSub, fontWeight: 700, borderBottom: "1px solid #152233" }}>
            <th style={{ padding: "6px 8px" }}>Concepto</th>
            <th style={{ padding: "6px 4px", textAlign: "right" }}>Dist.</th>
            <th style={{ padding: "6px 4px", textAlign: "right" }}>Util.</th>
            <th style={{ padding: "6px 8px", textAlign: "right" }}>Rest.</th>
          </tr>
        </thead>
        <tbody>
          {filas.map((f, idx) => (
            <tr key={idx} style={{ borderBottom: "1px solid #15223333", color: f.esHold ? "#4F7A99" : B.texto, background: f.esHold ? "#1A65A408" : "transparent" }}>
              <td style={{ padding: "6px 8px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: f.esHold ? B.textoSub : B.texto }}>{f.concepto}</td>
              <td style={{ padding: "6px 4px", textAlign: "right", whiteSpace: "nowrap" }}>{fmt(f.dist)}</td>
              <td style={{ padding: "6px 4px", textAlign: "right", whiteSpace: "nowrap" }}>{fmt(f.util)}</td>
              <td style={{ padding: "6px 8px", textAlign: "right", fontWeight: 600, whiteSpace: "nowrap" }}>{fmt(f.restante)}</td>
            </tr>
          ))}
          {sinCat > 0 && (
            <tr style={{ borderBottom: "1px solid #15223333", background: "#F59E0B11" }}>
              <td style={{ padding: "6px 8px", color: "#F59E0B", fontSize: 9, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>⚠ Sin categoría</td>
              <td style={{ padding: "6px 4px", textAlign: "right" }}>—</td>
              <td style={{ padding: "6px 4px", textAlign: "right", color: "#F59E0B", whiteSpace: "nowrap" }}>{fmt(sinCat)}</td>
              <td style={{ padding: "6px 8px", textAlign: "right", color: "#EF4444", whiteSpace: "nowrap" }}>{fmt(-sinCat)}</td>
            </tr>
          )}
          <tr style={{ background: "#0F1C2E", fontWeight: 700, color: "#fff", borderTop: "2px solid #152233" }}>
            <td style={{ padding: "7px 8px" }}>Totales</td>
            <td style={{ padding: "7px 4px", textAlign: "right", whiteSpace: "nowrap" }}>{fmt(totalDist)}</td>
            <td style={{ padding: "7px 4px", textAlign: "right", whiteSpace: "nowrap" }}>{fmt(totalUtil)}</td>
            <td style={{ padding: "7px 8px", textAlign: "right", color: B.celeste, whiteSpace: "nowrap" }}>{fmt(totalRest)}</td>
          </tr>
        </tbody>
      </table>
    </div>
  );
}

    const disp = saldosGlobales.statsCat[impOrigen]?.restante || 0;

function Distribucion({ onGuardar, todasCats = [] }) {
  const [fecha, setFecha] = useState(hoy());
  const [ingreso, setIngreso] = useState("");
  const [items, setItems] = useState([{ cat: "", monto: "" }]);
  const [ok, setOk] = useState(false);
  
  const totaling = parseFloat(ingreso) || 0;
  const totalDist = items.reduce((s, i) => s + (parseFloat(i.monto) || 0), 0);
  const diff = totaling - totalDist;
  
  const addItem = () => setItems([...items, { cat: "", monto: "" }]);
  const upd = (i, f, v) => { const a = [...items]; a[i][f] = v; setItems(a); };
  const rem = (i) => setItems(items.filter((_, x) => x !== i));
  const guardar = () => {
    if (!fecha || totaling === 0 || Math.abs(diff) > 0.01) return;
    onGuardar({ id: Date.now().toString(), fecha, ingreso: totaling, items: items.filter(i => i.cat && i.monto).map(i => ({ ...i, monto: parseFloat(i.monto) || 0 })) });
    setIngreso(""); setItems([{ cat: "", monto: "" }]);
    setOk(true); setTimeout(() => setOk(false), 3000);
  };
  
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14, width: "100%" }}>
      <Lbl>ASIGNACIÓN COMPLETA DEL DÍA</Lbl>
      {ok && <Card style={{ background: "#14532D", textAlign: "center", color: "#22C55E", fontWeight: 700 }}>Guardado e indexado en balances</Card>}
      <Card><Lbl>FECHA CONTABLE</Lbl><Inp type="date" value={fecha} onChange={e => setFecha(e.target.value)} /></Card>
      <Card glow>
        <Lbl>INGRESO BRUTO EVALUADO</Lbl>
        <Inp type="text" inputMode="decimal" placeholder="0.00" value={ingreso} onChange={e => setIngreso(e.target.value.replace(/[^0-9.,]/g, ''))} style={{ fontSize: 20, fontWeight: 700, color: B.celeste }} />
      </Card>
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <Lbl style={{ marginBottom: 0 }}>DISTRIBUCIÓN DE FONDOS</Lbl>
          <button onClick={addItem} style={{ background: `${B.azulOscuro}33`, border: `1px solid ${B.azulOscuro}`, color: B.celeste, borderRadius: 8, padding: "4px 12px", fontSize: 12, cursor: "pointer" }}>+ Fila</button>
        </div>
        {items.map((it, i) => (
          <div key={i} style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 8 }}>
            <Sel value={it.cat} onChange={e => upd(i, "cat", e.target.value)} style={{ flex: 2 }}>
              <option value="">Concepto...</option>
              {CUENTAS.map(cu => (
                <optgroup key={cu.id} label={cu.nombre}>
                  {todasCats.filter(c => c.cuenta === cu.id).map(c => (
                    <option key={c.id} value={c.id}>{c.nombre}</option>
                  ))}
                </optgroup>
              ))}
            </Sel>
            <Inp type="text" inputMode="decimal" placeholder="0.00" value={it.monto} onChange={e => upd(i, "monto", e.target.value.replace(/[^0-9.,]/g, ''))} style={{ flex: 1.5 }} />
            <button onClick={() => rem(i)} style={{ background: "transparent", border: "none", color: "#EF4444", fontSize: 24, padding: "0 6px", cursor: "pointer" }}>×</button>
          </div>
        ))}
        {totaling > 0 && (
          <div style={{ fontSize: 13, color: Math.abs(diff) < 0.01 ? "#22C55E" : diff > 0 ? "#F59E0B" : "#EF4444", fontWeight: 600, marginTop: 8 }}>
            {Math.abs(diff) < 0.01 ? "Distribución Cuadrada" : diff > 0 ? `Por asignar: ${fmtDisplay(diff)}` : `Excedido: ${fmtDisplay(Math.abs(diff))}`}
          </div>
        )}
      </Card>
      <Btn onClick={guardar} disabled={totaling === 0 || Math.abs(diff) > 0.01}>Procesar Distribución</Btn>
    </div>
  );
}

function Pagos({ pagos = [], setPagos, mesFiltro, saldosGlobales, todasCats = [] }) {
  const [sem, setSem] = useState(1);

  const [nombreEdicion, setNombreEdicion] = useState("");
  const [montoEdicion, setMontoEdicion] = useState("");
  const [cuentaEdicion, setCuentaEdicion] = useState("general");

  const pagosDelMes = pagos.filter(p => p.mes === mesFiltro);
  const fSem = (s) => pagosDelMes.filter(p => p.semana === s);
  const tots = (s) => fSem(s).reduce((a, p) => a + (parseFloat(p.monto) || 0), 0);
  const togglePago = (id) => setPagos(pagos.map(p => p.id === id ? { ...p, ok: !p.ok } : p));
  const eliminarItem = (id) => setPagos(pagos.filter(p => p.id !== id));
  
  const activarEdicionInline = (p) => { 
    setIdEdicionInline(p.id); setNombreEdicion(p.nombre); setMontoEdicion(p.monto); setCuentaEdicion(p.cuenta || "general"); 
  };
  const guardarEdicionInline = () => {
    setPagos(pagos.map(p => p.id === idEdicionInline ? { ...p, nombre: nombreEdicion, monto: parseFloat(montoEdicion) || 0, cuenta: cuentaEdicion } : p));
    setIdEdicionInline(null);
  };
  
  const agregarItem = () => {
    if (!nuevo.nombre || !nuevo.monto) return;
    setPagos([...pagos, { id: Date.now().toString(), semana: nuevo.semana, nombre: nuevo.nombre, monto: parseFloat(nuevo.monto) || 0, cuenta: nuevo.cuenta, ok: false, mes: mesFiltro }]);
    setNuevo({ semana: sem, nombre: "", monto: "", cuenta: "general" });
  };

  const checkFondos = (p) => {
    if (p.ok) return false;
    let catMatch = null;
    if (p.catId) {
      catMatch = todasCats.find(c => c.id === p.catId);
    } else {
      const np = p.nombre.trim().toLowerCase();
      if (p.cuenta === "nomina" && np.startsWith("nómina -")) {
        catMatch = todasCats.find(c => c.cuenta === "nomina" && c.nombre === (p.semana === 2 ? "1ra Quincena" : p.semana === 4 ? "2da Quincena" : ""));
      } else {
        catMatch = todasCats.find(c => c.cuenta === (p.cuenta || "general") && c.nombre.trim().toLowerCase() === np);
      }
      if (!catMatch) {
        catMatch = todasCats.find(c => c.cuenta === (p.cuenta || "general") && (c.nombre.toLowerCase().includes("hold") || c.nombre.toLowerCase().includes("fondo")));
      }
    }
    if (catMatch && saldosGlobales && saldosGlobales.statsCat[catMatch.id]) {
      return saldosGlobales.statsCat[catMatch.id].restante >= p.monto;
    }
    return false;
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14, width: "100%" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 700, color: B.texto }}>Presupuesto Semanal</div>
          <div style={{ fontSize: 12, color: B.textoSub }}>Egresos obligatorios programados</div>
        </div>
        <button onClick={() => { setEditMode(!editMode); setIdEdicionInline(null); }} style={{ background: "transparent", border: `1px solid ${B.celeste}`, color: B.celeste, padding: "6px 12px", borderRadius: 10, fontSize: 13, cursor: "pointer" }}>
          {editMode ? "✓ Ver Panel" : "Editar Estructura"}
        </button>
      </div>
      {!editMode ? (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6, width: "100%" }}>
            {[1, 2, 3, 4].map(s => (
              <button key={s} onClick={() => { setSem(s); setIdEdicionInline(null); }} style={{ background: sem === s ? "#1A65A433" : B.fondoCard, border: `1px solid ${sem === s ? B.azulOscuro : B.fondoBorde}`, borderRadius: 12, padding: 8, color: B.texto, cursor: "pointer" }}>
                <div style={{ fontSize: 9, color: B.textoSub }}>SEM {s}</div>
                <div style={{ fontSize: 11, fontWeight: 700, marginTop: 2 }}>{fmt(tots(s)).split(".")[0]}</div>
              </button>
            ))}
          </div>
          <Card>
            <Lbl>CUOTAS SEMANA {sem}</Lbl>
            {fSem(sem).length === 0 && <div style={{ fontSize: 13, color: B.textoSub, textAlign: "center", padding: "10px 0" }}>No hay rubros programados.</div>}
            {fSem(sem).map(p => {
              const esEditando = idEdicionInline === p.id;
              const fondosCompletos = checkFondos(p);

              return (
                <div key={p.id} style={{ display: "flex", flexDirection: "column", gap: 8, padding: "12px 0", borderBottom: `1px solid ${B.fondoBorde}44` }}>
                  {esEditando ? (
                    <div style={{ display: "flex", flexDirection: "column", gap: 8, width: "100%" }}>
                      <div style={{ display: "flex", gap: 6 }}>
                        <Inp value={nombreEdicion} onChange={e => setNombreEdicion(e.target.value)} style={{ flex: 2, padding: "6px 10px", fontSize: 13 }} placeholder="Nombre" />
                        <Inp type="text" inputMode="decimal" value={montoEdicion} onChange={e => setMontoEdicion(e.target.value.replace(/[^0-9.,]/g, ''))} style={{ flex: 1.2, padding: "6px 10px", fontSize: 13 }} placeholder="Monto" />
                      </div>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 6 }}>
                        <Sel value={cuentaEdicion} onChange={e => setCuentaEdicion(e.target.value)} style={{ padding: "6px 10px", fontSize: 12, flex: 1 }}>
                          {CUENTAS.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                        </Sel>
                        <div style={{ display: "flex", gap: 6 }}>
                          <button onClick={guardarEdicionInline} style={{ background: "#22C55E22", border: "1px solid #22C55E", color: "#22C55E", padding: "6px 12px", borderRadius: 8, fontSize: 12, cursor: "pointer", fontWeight: 600 }}>Guardar</button>
                          <button onClick={() => setIdEdicionInline(null)} style={{ background: "transparent", border: `1px solid ${B.textoSub}`, color: B.textoSub, padding: "6px 12px", borderRadius: 8, fontSize: 12, cursor: "pointer" }}>✕</button>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div style={{ display: "flex", alignItems: "center", gap: 10, width: "100%" }}>
                      <button onClick={() => togglePago(p.id)} style={{ width: 22, height: 22, borderRadius: 6, border: `2px solid ${p.ok ? "#22C55E" : B.fondoBorde}`, background: p.ok ? "#22C55E" : "transparent", color: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12 }}>
                        {p.ok ? "✓" : ""}
                      </button>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 14, color: p.ok ? B.textoSub : B.texto, display: "flex", alignItems: "center", gap: 6 }}>
                            {p.nombre} 
                            {p.isImprevisto && <span style={{ color: "#EF4444", fontSize: 10 }}>[Imprevisto]</span>}
                            {fondosCompletos && <div style={{ width: 6, height: 6, borderRadius: "50%", background: "#10B981" }} title="Fondos completos" />}
                        </div>
                        <div style={{ fontSize: 9, color: B.textoSub, textTransform: "uppercase" }}>SALIDA: {p.cuenta}</div>
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ fontSize: 14, fontWeight: 700, color: p.ok ? B.textoSub : B.texto }}>{fmtDisplay(p.monto)}</span>
                        <button onClick={() => activarEdicionInline(p)} style={{ background: "transparent", border: "none", color: "#FFFFFF", opacity: 0.6, fontSize: 14, cursor: "pointer", padding: "4px", display: "flex", alignItems: "center" }}>
                          <IconoCustom source={SVG_EDITAR} size={16} />
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </Card>
        </>
      ) : (
        <Card style={{ border: `1px solid ${B.azulMedio}` }}>
          <Lbl style={{ color: B.celeste }}>ORGANIZADOR COMPLETO DEL MES</Lbl>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 2fr", gap: 6 }}>
              <Sel value={nuevo.semana} onChange={e => setNuevo({ ...nuevo, semana: parseInt(e.target.value) })}>
                <option value={1}>Sem 1</option><option value={2}>Sem 2</option>
                <option value={3}>Sem 3</option><option value={4}>Sem 4</option>
              </Sel>
              <Inp placeholder="Gasto u Obligación" value={nuevo.nombre} onChange={e => setNuevo({ ...nuevo, nombre: e.target.value })} />
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1.5fr 1fr", gap: 6 }}>
              <Sel value={nuevo.cuenta} onChange={e => setNuevo({ ...nuevo, cuenta: e.target.value })}>
                {CUENTAS.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
              </Sel>
              <Inp type="text" inputMode="decimal" placeholder="0.00" value={nuevo.monto} onChange={e => setNuevo({ ...nuevo, monto: e.target.value.replace(/[^0-9.,]/g, '') })} />
            </div>
            <Btn onClick={agregarItem}>+ Insertar Obligación</Btn>
          </div>
          <Lbl style={{ marginTop: 14 }}>RUBROS ASIGNADOS AL MOMENTO</Lbl>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 200, overflowY: "auto" }}>
            {pagosDelMes.map(p => {
              const fondosCompletos = checkFondos(p);
              return (
                <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 6, background: "#091424", padding: "8px 10px", borderRadius: 10 }}>
                  <span style={{ fontSize: 10, color: B.textoSub, minWidth: 26 }}>S{p.semana}</span>
                  <span style={{ flex: 1, fontSize: 13, color: B.texto, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", display: "flex", alignItems: "center", gap: 6 }}>
                      {p.nombre} 
                      {p.isImprevisto && <span style={{ color: "#EF4444", fontSize: 10 }}>[Imp]</span>}
                      {fondosCompletos && <div style={{ width: 6, height: 6, borderRadius: "50%", background: "#10B981", flexShrink: 0 }} title="Fondos completos" />}
                  </span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: B.celeste }}>{fmt(p.monto).split(".")[0]}</span>
                  <button onClick={() => eliminarItem(p.id)} style={{ background: "transparent", border: "none", color: "#EF4444", fontSize: 24, padding: "0 6px", cursor: "pointer" }}>×</button>
                </div>
              );
            })}
          </div>
        </Card>
      )}
    </div>
  );
}

function Historial({ registros = [], setRegistros, todasCats = [], mesFiltro }) {
  const [editId, setEditId] = useState(null);
  const [editFecha, setEditFecha] = useState("");
  const [editIngreso, setEditIngreso] = useState("");
  const [editItems, setEditItems] = useState([]);

  const registrosDelMes = registros.filter(r => r.fecha.startsWith(mesFiltro));

  const comenzarEdicion = (reg) => { 
    setEditId(reg.id); 
    setEditFecha(reg.fecha); 
    setEditIngreso(reg.ingreso); 
    const migratedItems = reg.items.map(it => {
        let catId = it.cat;
        if (!catId.startsWith("sub_") && !catId.startsWith("g") && !catId.startsWith("n") && !catId.startsWith("i") && !catId.startsWith("e") && !catId.startsWith("pr")) {
            const match = todasCats.find(c => c.nombre === it.cat);
            if (match) catId = match.id;
        }
        return { ...it, cat: catId };
    });
    setEditItems(migratedItems); 
  };

  const guardarEdicion = () => {
    const totalBruto = parseFloat(editIngreso) || 0;
    const totalDist = editItems.reduce((acc, cur) => acc + (parseFloat(cur.monto) || 0), 0);
    if (Math.abs(totalBruto - totalDist) > 0.02) { alert('Error: La distribución no está cuadrada.'); return; }
    
    setRegistros(registros.map(r => r.id === editId ? { id: editId, fecha: editFecha, ingreso: totalBruto, items: editItems.filter(i => i.cat && i.monto).map(i => ({ ...i, monto: parseFloat(i.monto) || 0 })) } : r));
    setEditId(null);
  };
  
  const eliminarRegistro = (id) => { 
    if (window.confirm("¿Estás seguro de eliminar esta distribución?")) setRegistros(registros.filter(r => r.id !== id)); 
  };
  const updItem = (index, field, value) => { const copy = [...editItems]; copy[index][field] = value; setEditItems(copy); };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14, width: "100%" }}>
      <Lbl>HISTORIAL DE DISTRIBUCIONES DEL PERIODO</Lbl>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {registrosDelMes.length === 0 && <div style={{ color: B.textoSub, textAlign: "center", padding: 20 }}>No hay distribuciones.</div>}
        
        {[...registrosDelMes].reverse().map(r => (
          editId === r.id ? (
            <Card key={`edit-${r.id}`} style={{ border: `1px solid ${B.celeste}` }}>
              <Lbl style={{ color: B.celeste }}>EDITAR REGISTRO CONTABLE</Lbl>
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 12 }}>
                <Inp type="date" value={editFecha} onChange={e => setEditFecha(e.target.value)} />
                <Inp type="text" inputMode="decimal" value={editIngreso} onChange={e => setEditIngreso(e.target.value.replace(/[^0-9.,]/g, ''))} />
                {editItems.map((it, idx) => (
                  <div key={idx} style={{ display: "flex", gap: 4, alignItems: "center" }}>
                    <Sel value={it.cat} onChange={e => updItem(idx, "cat", e.target.value)} style={{ flex: 2 }}>
                      {CUENTAS.map(cu => (
                        <optgroup key={cu.id} label={cu.nombre}>
                          {todasCats.filter(c => c.cuenta === cu.id).map(c => (
                            <option key={c.id} value={c.id}>{c.nombre}</option>
                          ))}
                        </optgroup>
                      ))}
                    </Sel>
                    <Inp type="text" inputMode="decimal" value={it.monto} onChange={e => updItem(idx, "monto", e.target.value.replace(/[^0-9.,]/g, ''))} style={{ flex: 1.5 }} />
                  </div>
                ))}
                
                <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 4 }}>
                  <button onClick={() => setEditItems([...editItems, {cat: "", monto: ""}])} style={{ background: "transparent", color: B.celeste, border: `1px solid ${B.celeste}88`, borderRadius: 8, padding: "6px 12px", fontSize: 12, cursor: "pointer" }}>+ Agregar concepto</button>
                </div>

                <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                  <Btn onClick={guardarEdicion}>Guardar</Btn>
                  <Btn onClick={() => setEditId(null)} v="ghost">Cancelar</Btn>
                </div>
              </div>
            </Card>
          ) : (
            <Card key={r.id} style={{ padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
                <div>
                  <span style={{ fontSize: 14, fontWeight: 700, color: B.texto }}>{r.fecha.split("-").reverse().join("/")}</span>
                  <div style={{ fontSize: 11, color: B.textoSub }}>Monto Bruto: <span style={{ color: B.celeste }}>{fmtDisplay(r.ingreso)}</span></div>
                </div>
                <div style={{ display: "flex", gap: 14, marginRight: 4 }}>
                  <button onClick={() => comenzarEdicion(r)} style={{ background: "transparent", border: "none", color: B.celeste, cursor: "pointer", fontSize: 20, padding: "4px" }}>✎</button>
                  <button onClick={() => eliminarRegistro(r.id)} style={{ background: "transparent", border: "none", color: "#EF4444", cursor: "pointer", fontSize: 20, padding: "4px" }}>✕</button>
                </div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 4, background: "#06111F", padding: 8, borderRadius: 10 }}>
                {r.items.map((it, idx) => (
                  <div key={idx} style={{ display: "flex", justifyContent: "space-between", fontSize: 12 }}>
                    <span style={{ color: B.texto }}>• {todasCats.find(c => c.id === it.cat)?.nombre || it.cat}</span>
                    <span style={{ color: B.textoSub, fontWeight: 600 }}>{fmtDisplay(it.monto)}</span>
                  </div>
                ))}
              </div>
            </Card>
          )
        ))}
      </div>
    </div>
  );
}

function CuentasConfig({ balancesIniciales, setBalancesIniciales, todasCats, setTodasCats, transferencias, setTransferencias, mesFiltro, saldosGlobales }) {
  const [nuevaSubcat, setNuevaSubcat] = useState("");
  const [cuentaSeleccionada, setCuentaSeleccionada] = useState("general");
  const [cuentaExpandida, setCuentaExpandida] = useState(null);
  const [editandoNombreId, setEditandoNombreId] = useState(null);
  const [nuevoNombre, setNuevoNombre] = useState("");
  const [seccionesAbiertas, setSeccionesAbiertas] = useState({});
  
  const [mostrarTransf, setMostrarTransf] = useState(false);
  const [trOrigen, setTrOrigen] = useState("");
  const [trDestino, setTrDestino] = useState("");
  const [trMonto, setTrMonto] = useState(0);

  const toggleSeccion = (cuentaId) => setSeccionesAbiertas(prev => ({ ...prev, [cuentaId]: !prev[cuentaId] }));
  
  const agregarSubcategoria = () => {
    if (!nuevaSubcat.trim()) return;
    const cuentaObj = CUENTAS.find(c => c.id === cuentaSeleccionada);
    setTodasCats([...todasCats, { id: "sub_" + Date.now(), nombre: nuevaSubcat.trim(), cuenta: cuentaSeleccionada, color: cuentaObj ? cuentaObj.color : "#4EA5E0" }]);
    setNuevaSubcat("");
    setSeccionesAbiertas(prev => ({ ...prev, [cuentaSeleccionada]: true }));
  };
  
  const eliminarSubcategoria = (id) => setTodasCats(todasCats.filter(c => c.id !== id));

  const iniciarEdicionNombre = (cat) => { setEditandoNombreId(cat.id); setNuevoNombre(cat.nombre); };
  const guardarNombre = () => {
    if (!nuevoNombre.trim()) return;
    setTodasCats(todasCats.map(c => c.id === editandoNombreId ? { ...c, nombre: nuevoNombre.trim() } : c));
    setEditandoNombreId(null);
  };

  const moverCat = (id, direction) => {
    const index = todasCats.findIndex(c => c.id === id);
    if (index < 0) return;
    const cat = todasCats[index];
    let targetIndex = -1;
    if (direction === -1) {
      for (let i = index - 1; i >= 0; i--) { if (todasCats[i].cuenta === cat.cuenta) { targetIndex = i; break; } }
    } else {
      for (let i = index + 1; i < todasCats.length; i++) { if (todasCats[i].cuenta === cat.cuenta) { targetIndex = i; break; } }
    }
    if (targetIndex !== -1) {
      const newCats = [...todasCats];
      newCats[index] = newCats[targetIndex];
      newCats[targetIndex] = cat;
      setTodasCats(newCats);
    }
  };

  const ejecutarTransferencia = () => {
    const montoNum = parseFloat(trMonto);
    if (!trOrigen || !trDestino || isNaN(montoNum) || montoNum <= 0) return;
    if (trOrigen === trDestino) { alert("La categoría de origen y destino deben ser distintas."); return; }
    
    const disp = saldosGlobales.statsCat[trOrigen]?.restante || 0;
    if (montoNum > disp) { alert(`Fondos insuficientes. Disponible: ${fmt(disp)}`); return; }

    const catOr = todasCats.find(c => c.id === trOrigen);
    const catDe = todasCats.find(c => c.id === trDestino);
    
    setTransferencias([...transferencias, {
      id: Date.now().toString(),
      fecha: hoy(),
      mes: mesFiltro,
      origen: catOr.id,
      origenNombre: catOr.nombre,
      origenCuenta: catOr.cuenta,
      destino: catDe.id,
      destinoNombre: catDe.nombre,
      destinoCuenta: catDe.cuenta,
      monto: montoNum
    }]);
    
    setTrOrigen(""); setTrDestino(""); setTrMonto(0);
    setMostrarTransf(false);
  };

  const minimalistSelectStyle = { background: "transparent", border: "none", borderBottom: `2px solid ${B.celeste}44`, borderRadius: 0, padding: "8px 0", fontSize: 15, color: B.texto, outline: "none" };

  const balancesMes = balancesIniciales[mesFiltro] || {};
  const setBalancesMes = (catId, val) => {
    setBalancesIniciales(prev => ({
      ...prev,
      [mesFiltro]: {
        ...(prev[mesFiltro] || {}),
        [catId]: val
      }
    }));
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16, width: "100%" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 700, color: B.texto }}>Panel de Cuentas</div>
          <div style={{ fontSize: 12, color: B.textoSub }}>Configura y reasigna liquidez</div>
        </div>
        <button onClick={() => setMostrarTransf(!mostrarTransf)} style={{ background: "transparent", border: `1px solid ${B.celeste}`, color: B.celeste, padding: "6px 12px", borderRadius: 10, fontSize: 13, cursor: "pointer", fontWeight: 600 }}>
          {mostrarTransf ? "✕ Cerrar Panel" : "⇄ Mover Fondos"}
        </button>
      </div>

      {mostrarTransf && (
        <>
          <Card style={{ border: `1px solid ${B.celeste}`, background: "#0C1828", marginBottom: 8 }}>
            <Lbl style={{ color: B.celeste }}>TRANSFERENCIA INTERNA DE FONDOS</Lbl>
            <div style={{ display: "flex", flexDirection: "column", gap: 14, marginTop: 10 }}>
              <div style={{ display: "flex", flexDirection: "column" }}>
                <Lbl style={{ marginBottom: 4 }}>De (Sale el dinero)</Lbl>
                <select value={trOrigen} onChange={e => setTrOrigen(e.target.value)} style={minimalistSelectStyle}>
                  <option value="" style={{ color: "#000" }}>Seleccionar Origen...</option>
                  {CUENTAS.map(cu => (
                    <optgroup key={`ori_${cu.id}`} label={cu.nombre.toUpperCase()}>
                      {todasCats.filter(c => c.cuenta === cu.id).map(c => (
                        <option key={`o-${c.id}`} value={c.id} style={{ color: "#000" }}>
                          {c.nombre} (Disp: {fmt(saldosGlobales.statsCat[c.id]?.restante || 0)})
                        </option>
                      ))}
                    </optgroup>
                  ))}
                </select>
              </div>
              <div style={{ display: "flex", flexDirection: "column" }}>
                <Lbl style={{ marginBottom: 4 }}>Para (Entra el dinero)</Lbl>
                <select value={trDestino} onChange={e => setTrDestino(e.target.value)} style={minimalistSelectStyle}>
                  <option value="" style={{ color: "#000" }}>Seleccionar Destino...</option>
                  {CUENTAS.map(cu => (
                    <optgroup key={`des_${cu.id}`} label={cu.nombre.toUpperCase()}>
                      {todasCats.filter(c => c.cuenta === cu.id).map(c => (
                        <option key={`d-${c.id}`} value={c.id} disabled={c.id === trOrigen} style={{ color: "#000" }}>
                          {c.nombre}
                        </option>
                      ))}
                    </optgroup>
                  ))}
                </select>
              </div>
              <div style={{ display: "flex", flexDirection: "column", marginBottom: 6 }}>
                <Lbl style={{ marginBottom: 4 }}>Monto a transferir</Lbl>
                <InputDecimalContable 
                   value={trMonto} 
                   onChange={val => setTrMonto(val)} 
                   style={{ border: "none", borderBottom: `2px solid ${B.celeste}`, borderRadius: 0, padding: "8px 0", background: "transparent" }}
                   inputStyle={{ textAlign: "left", fontSize: 20, fontWeight: "bold" }}
                />
              </div>
              <Btn onClick={ejecutarTransferencia} disabled={!trOrigen || !trDestino || !trMonto || trMonto <= 0}>Confirmar Movimiento</Btn>
            </div>
          </Card>

          <Card style={{ background: "#09121F", marginBottom: 12 }}>
            <Lbl style={{ color: B.textoSub }}>HISTORIAL DE TRANSFERENCIAS ({mesFiltro})</Lbl>
            {transferencias.filter(t => t.mes === mesFiltro).length === 0 ? (
              <div style={{ fontSize: 12, color: B.textoSub, textAlign: "center", padding: "10px 0" }}>No hay transferencias este mes.</div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 8 }}>
                {[...transferencias].filter(t => t.mes === mesFiltro).reverse().map(t => (
                  <div key={t.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#0C1828", border: `1px solid ${B.fondoBorde}`, borderRadius: 10, padding: "10px" }}>
                    <div>
                      <div style={{ fontSize: 10, color: B.textoSub }}>{t.fecha ? t.fecha.split("-").reverse().join("/") : t.mes}</div>
                      <div style={{ fontSize: 12, color: B.texto, fontWeight: 600 }}>{t.origenNombre || t.origen} ➔ {t.destinoNombre || t.destino}</div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ fontSize: 14, fontWeight: "bold", color: B.celeste }}>{fmt(t.monto)}</div>
                      <button onClick={() => { if(window.confirm("¿Eliminar transferencia?")) setTransferencias(transferencias.filter(x => x.id !== t.id)); }} style={{ background: "transparent", border: "none", color: "#EF4444", fontSize: 20, cursor: "pointer", padding: "0 4px" }}>✕</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Card>
        </>
      )}

      <Card glow style={{ padding: 14 }}>
        <Lbl style={{ color: B.celeste, marginBottom: 12 }}>FONDOS DE ENTRADA INICIALES POR CUENTA</Lbl>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {CUENTAS.map(c => {
            const subcats = todasCats.filter(cat => cat.cuenta === c.id);
            const estaAbierto = cuentaExpandida === c.id;
            const totalInicialCuenta = subcats.reduce((sum, sub) => sum + (parseFloat(balancesMes[sub.id]) || 0), 0);
            return (
              <div key={c.id} style={{ background: "#091424", border: `1px solid ${estaAbierto ? c.color + "77" : "#152233"}`, borderRadius: 14, overflow: "hidden" }}>
                <div onClick={() => setCuentaExpandida(estaAbierto ? null : c.id)} style={{ padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer", background: estaAbierto ? "#112236" : "transparent" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <IconoCustom source={SVG_CUENTAS[c.id]} size={16} />
                    <span style={{ fontSize: 13, fontWeight: 700, color: B.texto }}>{c.nombre}</span>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: c.color }}>{fmtDisplay(totalInicialCuenta)}</span>
                    <span style={{ fontSize: 12, color: B.textoSub }}>{estaAbierto ? "▲" : "▼"}</span>
                  </div>
                </div>
                {estaAbierto && (
                  <div style={{ padding: "12px 14px", background: "#0C1828", borderTop: "1px solid #152233", display: "flex", flexDirection: "column", gap: 10 }}>
                    {subcats.length === 0 ? (
                      <div style={{ fontSize: 12, color: B.textoSub, textAlign: "center" }}>No hay conceptos asignados.</div>
                    ) : (
                      subcats.map(sub => (
                        <div key={sub.id} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                          <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", alignItems: "center", gap: 8 }}>
                            {editandoNombreId === sub.id ? (
                              <div style={{ display: "flex", gap: 4 }}>
                                <Inp value={nuevoNombre} onChange={e => setNuevoNombre(e.target.value)} style={{ padding: "5px 8px", fontSize: 12, flex: 1 }} />
                                <button onClick={guardarNombre} style={{ background: "#22C55E22", border: "1px solid #22C55E", color: "#22C55E", borderRadius: 8, padding: "4px 8px", fontSize: 11, cursor: "pointer" }}>✓</button>
                                <button onClick={() => setEditandoNombreId(null)} style={{ background: "transparent", border: `1px solid ${B.textoSub}`, color: B.textoSub, borderRadius: 8, padding: "4px 8px", fontSize: 11, cursor: "pointer" }}>✕</button>
                              </div>
                            ) : (
                              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                                <span style={{ fontSize: 13, color: B.texto, flex: 1 }}>{sub.nombre}</span>
                                <button onClick={() => iniciarEdicionNombre(sub)} style={{ background: "transparent", border: "none", color: B.textoSub, cursor: "pointer", padding: "8px 4px", margin: "-8px 0" }}>
                                  <IconoCustom source={SVG_EDITAR} size={14} />
                                </button>
                              </div>
                            )}
                            <InputDecimalContable value={balancesMes[sub.id] || 0} onChange={val => setBalancesMes(sub.id, val)} />
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </Card>

      <Card>
        <Lbl>CREAR NUEVA SUBCATEGORÍA</Lbl>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <div style={{ display: "grid", gridTemplateColumns: "1.2fr 1fr", gap: 6 }}>
            <Inp placeholder="Ej: Gasoil Extra" value={nuevaSubcat} onChange={e => setNuevaSubcat(e.target.value)} />
            <Sel value={cuentaSeleccionada} onChange={e => setCuentaSeleccionada(e.target.value)}>
              {CUENTAS.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
            </Sel>
          </div>
          <Btn onClick={agregarSubcategoria}>+ Agregar Subcategoría</Btn>
        </div>
      </Card>

      <Card style={{ background: "#09121F" }}>
        <Lbl style={{ color: B.textoSub }}>SUBCATEGORÍAS CONFIGURADAS</Lbl>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 10 }}>
          {CUENTAS.map(c => {
            const subcatsDeEstaCuenta = todasCats.filter(cat => cat.cuenta === c.id);
            if (subcatsDeEstaCuenta.length === 0) return null;
            const abierta = seccionesAbiertas[c.id];
            return (
              <div key={c.id} style={{ background: "#0C1828", border: `1px solid ${abierta ? c.color + "55" : "#1A2E44"}`, borderRadius: 12, overflow: "hidden" }}>
                <div onClick={() => toggleSeccion(c.id)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", cursor: "pointer", background: abierta ? "#0F1E30" : "transparent" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <IconoCustom source={SVG_CUENTAS[c.id]} size={13} />
                    <span style={{ fontSize: 12, fontWeight: 700, color: c.color, textTransform: "uppercase", letterSpacing: "0.08em" }}>{c.nombre}</span>
                    <span style={{ fontSize: 11, color: B.textoSub, background: "#152233", borderRadius: 6, padding: "1px 6px" }}>{subcatsDeEstaCuenta.length}</span>
                  </div>
                  <span style={{ fontSize: 11, color: B.textoSub, transition: "transform 0.2s" }}>{abierta ? "▲" : "▼"}</span>
                </div>
                {abierta && (
                  <div style={{ padding: "10px 14px 14px", display: "flex", flexDirection: "column", gap: 8 }}>
                    {subcatsDeEstaCuenta.map((sub, idx) => (
                      <div key={sub.id} style={{ display: "flex", alignItems: "center", gap: 6, background: "#09121F", border: "1px solid #1A2E44", borderRadius: 10, padding: "8px 12px", fontSize: 13, color: B.texto }}>
                        <span style={{ flex: 1 }}>{sub.nombre}</span>
                        
                        <div style={{ display: "flex", gap: 2, marginRight: 6 }}>
                           <button onClick={() => moverCat(sub.id, -1)} disabled={idx === 0} style={{ background: "transparent", border: "none", color: idx === 0 ? "#1A2E44" : B.textoSub, cursor: idx === 0 ? "default" : "pointer", padding: "4px", fontSize: 14 }}>↑</button>
                           <button onClick={() => moverCat(sub.id, 1)} disabled={idx === subcatsDeEstaCuenta.length - 1} style={{ background: "transparent", border: "none", color: idx === subcatsDeEstaCuenta.length - 1 ? "#1A2E44" : B.textoSub, cursor: idx === subcatsDeEstaCuenta.length - 1 ? "default" : "pointer", padding: "4px", fontSize: 14 }}>↓</button>
                        </div>

                        <button onClick={() => iniciarEdicionNombre(sub)} style={{ background: "transparent", border: "none", color: B.textoSub, cursor: "pointer", padding: "6px 8px", opacity: 0.8 }}>✎</button>
                        <button onClick={() => { if (window.confirm(`¿Eliminar "${sub.nombre}"?`)) eliminarSubcategoria(sub.id); }} style={{ background: "transparent", border: "none", color: "#EF4444", cursor: "pointer", fontWeight: "bold", fontSize: 14, padding: "6px 8px" }}>✕</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

// COMPONENTE PRINCIPAL CON LÓGICA DE CARGA Y MIGRACIÓN HACIA FIREBASE
function Main() {
  const [isReady, setIsReady] = useState(false);

  useEffect(() => {
    const initFirebaseAndMigrate = async () => {
      if (!window.db) return; 
      
      const keys = ["ar_registros_v5", "ar_pagos_v5", "ar_cats_v5", "ar_balances_v5", "ar_transferencias_v5"];
      let needsMig = false;
      let migData = {};
      
      // Intentar leer datos de localStorage
      for (let k of keys) {
        const local = localStorage.getItem(k);
        if (local) {
          needsMig = true;
          migData[k] = JSON.parse(local);
        }
      }

      if (needsMig) {
        try {
          // Revisar si Firebase está vacío en la clave de registros para no sobreescribir datos compartidos
          const snap = await window.dbGet(window.dbRef(window.db, "ar_registros_v5"));
          if (!snap.exists()) {
            console.log("Subiendo datos locales a Firebase...");
            for (let k of keys) {
              if (migData[k] !== undefined) {
                await window.dbSet(window.dbRef(window.db, k), migData[k]);
              }
            }
          }
          // Limpiar el teléfono para evitar subidas dobles
          for (let k of keys) {
            localStorage.removeItem(k);
          }
        } catch (error) {
          console.error("Error durante la migración a Firebase:", error);
        }
      }
      
      setIsReady(true);
    };

    if (window.db) {
      initFirebaseAndMigrate();
    } else {
      const handleReady = () => initFirebaseAndMigrate();
      window.addEventListener('firebase-ready', handleReady);
      return () => window.removeEventListener('firebase-ready', handleReady);
    }
  }, []);

  if (!isReady) {
    return (
      <div style={{ height: "100vh", display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", backgroundColor: B.fondo, color: B.celeste }}>
        <div style={{ width: 40, height: 40, border: `4px solid ${B.fondoBorde}`, borderTopColor: B.celeste, borderRadius: "50%", animation: "spin 1s linear infinite" }} />
        <style>{`@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`}</style>
        <h3 style={{ marginTop: 20, letterSpacing: "0.1em", fontWeight: 700 }}>CONECTANDO A LA NUBE</h3>
      </div>
    );
  }

  return <App />;
}

function App() {
  const [tab, setTab] = useLocalStore("ar_tab_v5", "inicio");
  const [mesFiltro, setMesFiltro] = useLocalStore("ar_mes_filtro_v5", obtenerMesActual());

  const [registros, setRegistros, regLoaded] = useFirebaseStore("ar_registros_v5", []);
  const [pagos, setPagos, pagLoaded] = useFirebaseStore("ar_pagos_v5", INITIAL_PAGOS);
  const [todasCats, setTodasCats, catLoaded] = useFirebaseStore("ar_cats_v5", INITIAL_CATS);
  const [balancesIniciales, setBalancesIniciales, balLoaded] = useFirebaseStore("ar_balances_v5", {});
  const [transferencias, setTransferencias, transLoaded] = useFirebaseStore("ar_transferencias_v5", []);

  // Adaptación de compatibilidad para datos antiguos
  useEffect(() => {
    if (!balLoaded) return;
    const keys = Object.keys(balancesIniciales);
    if (keys.length > 0 && !keys.some(k => k.includes("-"))) {
      setBalancesIniciales({ "2026-05": balancesIniciales });
    }
  }, [balLoaded]); 

  useEffect(() => {
    if (!pagLoaded) return;
    if (pagos.length > 0 && !pagos[0].mes) {
      const mesAct = obtenerMesActual();
      setPagos(pagos.map(p => ({ ...p, mes: p.mes || mesAct })));
    } else {
      const tienePagosParaMes = pagos.some(p => p.mes === mesFiltro);
      if (!tienePagosParaMes) {
        const nuevosPagosMes = INITIAL_PAGOS.map(p => ({ ...p, id: p.id + "_" + mesFiltro, mes: mesFiltro, ok: false }));
        // Prevención de duplicados exactos usando Set
        setPagos(prev => {
          const prevIds = new Set(prev.map(x => x.id));
          const toAdd = nuevosPagosMes.filter(x => !prevIds.has(x.id));
          if (toAdd.length === 0) return prev;
          return [...prev, ...toAdd];
        });
      }
    }
  }, [mesFiltro, pagos.length, pagLoaded]);

  const saldosGlobales = useMemo(() => calcularSaldos(mesFiltro, todasCats, balancesIniciales, registros, pagos, transferencias), [mesFiltro, todasCats, balancesIniciales, registros, pagos, transferencias]);

  const svgInicio = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16v5"/><path d="M16 14.639V21"/><path d="M20 10.656V21"/><path d="m22 3-8.646 8.646a.5.5 0 0 1-.708 0L9.354 8.354a.5.5 0 0 0-.707 0L2 15"/><path d="M4 18.463V21"/><path d="M8 14.656V21"/></svg>';
  const svgDist = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.9l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/></svg>';
  const svgPagos = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/></svg>';
  const svgHist = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>';
  const svgCuentas = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>';

  return (
    <div style={{ height: "100%", display: "flex", flexDirection: "column", backgroundColor: B.fondo, color: B.texto, boxSizing: "border-box", overflow: "hidden" }}>
      <div style={{ flexShrink: 0, background: "linear-gradient(to bottom, #0A1422, #07101C)", borderBottom: `1px solid ${B.fondoBorde}`, padding: "40px 20px 16px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", zIndex: 100 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <svg width="28" height="28" viewBox="0 0 100 100" fill="none">
            <rect width="100" height="100" rx="22" fill="#0C1828"/>
            <path d="M50 15 C50 15 26 48 26 65 C26 79 36.8 90 50 90 C63.2 90 74 79 74 65 C74 48 50 15 50 15Z" fill="#1A65A4"/>
            <path d="M50 28 C50 28 32 52 32 65 C32 75 40 82 50 82 C60 82 68 75 68 65 C68 52 50 28 50 28Z" fill="#70CCE1" opacity="0.85"/>
            <path d="M38 58 C36 64 39 72 46 76" stroke="#FFFFFF" strokeWidth="4" strokeLinecap="round" opacity="0.9"/>
          </svg>
          <span style={{ fontSize: 16, fontWeight: 800, letterSpacing: "0.05em", color: "#fff" }}>AGUA RUTH</span>
        </div>
        <div style={{ width: 135 }}>
          <Sel value={mesFiltro} onChange={e => setMesFiltro(e.target.value)} style={{ padding: "6px 10px", fontSize: 12, background: "#111E2E", borderRadius: 8, height: 32 }}>
            {MESES_2026.map(m => <option key={m.val} value={m.val}>{m.label}</option>)}
          </Sel>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "16px", display: "flex", flexDirection: "column", width: "100%", boxSizing: "border-box" }}>
        {tab === "inicio" && <Dashboard registros={registros} pagos={pagos} setPagos={setPagos} transferencias={transferencias} setTransferencias={setTransferencias} todasCats={todasCats} mesFiltro={mesFiltro} saldosGlobales={saldosGlobales} />}
        {tab === "distribuir" && <Distribucion onGuardar={r => setRegistros([...registros, r])} todasCats={todasCats} />}
        {tab === "pagos" && <Pagos pagos={pagos} setPagos={setPagos} mesFiltro={mesFiltro} saldosGlobales={saldosGlobales} todasCats={todasCats} />}
        {tab === "historial" && <Historial registros={registros} setRegistros={setRegistros} todasCats={todasCats} mesFiltro={mesFiltro} />}
        {tab === "cuentas" && <CuentasConfig balancesIniciales={balancesIniciales} setBalancesIniciales={setBalancesIniciales} todasCats={todasCats} setTodasCats={setTodasCats} transferencias={transferencias} setTransferencias={setTransferencias} mesFiltro={mesFiltro} saldosGlobales={saldosGlobales} />}
        <div style={{ height: 80, flexShrink: 0 }} />
      </div>

      <div style={{ flexShrink: 0, backgroundColor: "#091424F2", backdropFilter: "blur(20px)", borderTop: `1px solid ${B.fondoBorde}`, display: "flex", justifyContent: "space-around", padding: "10px 10px calc(10px + env(safe-area-inset-bottom)) 10px", zIndex: 1000 }}>
        {[
          { id: "inicio", label: "Inicio", svg: svgInicio },
          { id: "distribuir", label: "Distribuir", svg: svgDist },
          { id: "pagos", label: "Semanal", svg: svgPagos },
          { id: "historial", label: "Historial", svg: svgHist },
          { id: "cuentas", label: "Cuentas", svg: svgCuentas }
        ].map(t => {
          const act = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)} style={{ background: "transparent", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 5, color: act ? B.celeste : B.textoSub, cursor: "pointer", padding: "6px 0", flex: 1, outline: "none" }}>
              <IconoCustom source={t.svg} size={20} />
              <span style={{ fontSize: 10, fontWeight: act ? 700 : 500, letterSpacing: "0.02em" }}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Main />);
</script>
